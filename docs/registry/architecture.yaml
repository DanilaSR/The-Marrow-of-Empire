# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: audio_backend
    status: active
    api: kaiju/src/platform/audio/ (SoLoud via CGo)
    not: external audio library / FMOD / Wwise
    adr: docs/architecture/adr-0014-audio-system.md
    reason: "Kaiju Engine ships SoLoud as its sole audio backend (prebuilt libsoloud_*.a). Full C API is in soloud_c.h; Go wrapper currently exposes only basic play/stop/mute — CGo extension required for per-voice volume, fades, 3D spatial, filters."
    referenced_by:
      - docs/architecture/adr-0014-audio-system.md
    added: 2026-08-12
    revised: ""

  - purpose: item_data_format
    status: active
    api: Per-region YAML files (assets/items/{region_slug}.yaml)
    not: Go hardcoded structs / single JSON database / runtime procedural generation
    adr: docs/architecture/adr-0015-loot-economy.md
    reason: "Data-driven content separable from engine. Per-region files prevent cross-region contamination and reduce merge conflicts. Consistent with KG .kg file pattern (ADR-0005)."
    referenced_by:
      - docs/architecture/adr-0015-loot-economy.md
    added: 2026-08-12
    revised: ""

  - purpose: llm_inference_backend
    status: active
    api: llama.cpp subprocess via stdin/stdout JSONL IPC (or local socket)
    not: in-process CGo for models >500M / HTTP server mode / cloud API
    adr: docs/architecture/adr-0008-llm-inference-integration.md
    reason: "Process isolation, crash independence, memory separation. Prompt caching via llama-server slot-level KV cache reuse with cache key (npc_id, trust_level, exemplar_variant). Slot abort for cancellation (preserves KV cache, does not consume restart budget)."
    referenced_by:
      - docs/architecture/adr-0008-llm-inference-integration.md
    added: 2026-08-12
    revised: ""

