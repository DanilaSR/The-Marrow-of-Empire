#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: stats_level_up
    status: active
    pattern: event_bus
    producer: stats
    consumers:
      - combat-ui             # subscribes to stats.level_up, updates MaxHealth/AP display
    adr: docs/architecture/adr-0006-character-stats-component-schema.md
    signal_signature: "stats.level_up (EntityID: GameEntityID, NewLevel: int, NewMaxHealth: int, NewAP: int)"
    referenced_by:
      - docs/architecture/adr-0006-character-stats-component-schema.md
      - docs/architecture/adr-0011-event-bus-architecture.md
    added: 2026-08-11
    revised: ""

  - contract: equipment_slot_registry
    status: active
    pattern: shared_resource
    producer: loot-economy
    consumers:
      - character-inventory-ui   # reads slot definitions for equip UI
      - tactical-combat-engine   # reads equipped item stats for damage calc
    adr: docs/architecture/adr-0015-loot-economy.md
    signal_signature: "8 slots: head, chest, hands, legs, main_hand, off_hand, accessory_1, accessory_2"
    referenced_by:
      - docs/architecture/adr-0015-loot-economy.md
      - docs/architecture/adr-0009-combat-engine.md
    added: 2026-08-12
    revised: ""

  - contract: audio_sfx_oneshot
    status: active
    pattern: event_bus
    producer: any_system
    consumers:
      - audio-system          # subscribes to audio.sfx_oneshot, plays one-shot sound
    adr: docs/architecture/adr-0014-audio-system.md
    signal_signature: "audio.sfx_oneshot (SoundID: uint32, WorldPosition: [3]float32, Volume: float32)"
    referenced_by:
      - docs/architecture/adr-0014-audio-system.md
      - docs/architecture/adr-0011-event-bus-architecture.md
    added: 2026-08-12
    revised: ""

