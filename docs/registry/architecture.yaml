# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: audio-system
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0014-audio-system.md
    notes: "Ambient crossfade + music state machine + SFX dispatch combined. Measured at p95 with combat active (10 SFX events/frame)."
    referenced_by:
      - docs/architecture/adr-0014-audio-system.md
    added: 2026-08-12
    revised: ""

  - system: ai-dialogue-engine
    status: active
    budget_ms: 0.035
    adr: docs/architecture/adr-0008-llm-inference-integration.md
    notes: "Prompt builder <5ms p95 + post-processing <30ms total. Non-blocking — inference runs in separate process. Does NOT include LLM generation time (external process)."
    referenced_by:
      - docs/architecture/adr-0008-llm-inference-integration.md
    added: 2026-08-12
    revised: ""

