<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>The Marrow of Empire — телепромптер</title>
<style>
:root{--vek:#e6a85c;--tomas:#9cc3e6;--mira:#a9cf9a;--star:#ffd166;--bg:#0c0c0e;--fg:#efeae0;--dim:#777263;--line-size:4.6vw}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:16px 26px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid #1e1d1a}
#scene{color:#b9b19c}
#progress{font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2.4vh;padding:3vh 6vw;text-align:center}
#cue{min-height:1.6em;font-size:clamp(14px,1.4vw,22px);color:var(--dim);font-style:italic;max-width:70ch}
#char{font-size:clamp(15px,1.6vw,24px);letter-spacing:.3em;text-transform:uppercase;font-weight:800}
#star{font-size:clamp(12px,1.1vw,16px);color:var(--star);letter-spacing:.12em;text-transform:uppercase;min-height:1em}
#line{font-size:clamp(24px,var(--line-size),120px);line-height:1.22;font-weight:500;max-width:34ch;margin:0}
#dir{font-size:clamp(14px,1.4vw,22px);font-style:italic;color:#9a9383;max-width:60ch;min-height:1em}
footer{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid #1e1d1a}
button{background:#191817;color:#cfc7b4;border:1px solid #2b2925;border-radius:999px;padding:8px 16px;font-size:13px;letter-spacing:.04em;cursor:pointer}
button:hover{background:#232120}
button.active{background:#2e2a22;border-color:#5a4d33;color:#ffd88a}
button.nav{padding:10px 22px;font-size:15px}
.hint{color:#5f5a4e;font-size:12px;letter-spacing:.04em;padding:0 8px}
@media (max-width:760px){.hint{display:none}}
</style>
</head>

<script>
const LINES = [{"id": "S01-VEK-001", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Слышишь? Вот так звучит жизнь человека, когда она кончилась.", "dir": "не поднимая глаз; кладёт брусок на наковальню и бьёт — он гнётся, звона нет", "star": false, "cue": "", "cueChar": ""}, {"id": "S01-TOMAS-002", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Век—", "dir": "", "star": false, "cue": "Слышишь? Вот так звучит жизнь человека, когда она кончилась.", "cueChar": "Век"}, {"id": "S01-VEK-003", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Нет. Ты посмотри на неё. Сорок лет я знаю сталь. Она звенит. Сначала упирается, потом звенит. А эта прогибается под молотом.", "dir": "поднимает согнутый брусок", "star": false, "cue": "Век—", "cueChar": "Томас"}, {"id": "S01-TOMAS-004", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Руда плохая. Я тебе говорил. Пласт остыл.", "dir": "", "star": false, "cue": "Нет. Ты посмотри на неё. Сорок лет я знаю сталь. Она звенит. Сначала упирается, потом звенит. А эта прогибается под молотом.", "cueChar": "Век"}, {"id": "S01-VEK-005", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Пласт. *(пауза)* Томас. Я покупаю у тебя руду с тех пор, как у тебя ещё борода не росла. Ты ни разу не продал мне плохого бруска. Ни разу.", "dir": "", "star": false, "cue": "Руда плохая. Я тебе говорил. Пласт остыл.", "cueChar": "Томас"}, {"id": "S01-TOMAS-006", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Всё когда-то бывает впервые.", "dir": "", "star": false, "cue": "Пласт. *(пауза)* Томас. Я покупаю у тебя руду с тех пор, как у тебя ещё борода не росла. Ты ни разу не продал мне плохого бруска. Ни разу.", "cueChar": "Век"}, {"id": "S01-VEK-007", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Бывает, значит. Ты на меня не смотришь.", "dir": "кладёт брусок", "star": false, "cue": "Всё когда-то бывает впервые.", "cueChar": "Томас"}, {"id": "S01-TOMAS-008", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Я смотрю на тебя.", "dir": "", "star": false, "cue": "Бывает, значит. Ты на меня не смотришь.", "cueChar": "Век"}, {"id": "S01-VEK-009", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Ты смотришь на мой молот. Это не одно и то же.", "dir": "", "star": false, "cue": "Я смотрю на тебя.", "cueChar": "Томас"}, {"id": "S01-TOMAS-010", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Старая леди затоплена.", "dir": "тихо", "star": false, "cue": "Ты смотришь на мой молот. Это не одно и то же.", "cueChar": "Век"}, {"id": "S01-VEK-011", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Затоплена. В сухой сезон.", "dir": "", "star": false, "cue": "Старая леди затоплена.", "cueChar": "Томас"}, {"id": "S01-TOMAS-012", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Бывает. Глубокий ствол — вода поднялась быстро. Снизу.", "dir": "", "star": false, "cue": "Затоплена. В сухой сезон.", "cueChar": "Век"}, {"id": "S01-VEK-013", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "В шахте вода не поднимается снизу. Она приходит сверху.", "dir": "", "star": false, "cue": "Бывает. Глубокий ствол — вода поднялась быстро. Снизу.", "cueChar": "Томас"}, {"id": "S01-TOMAS-014", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Эта пришла снизу.", "dir": "", "star": false, "cue": "В шахте вода не поднимается снизу. Она приходит сверху.", "cueChar": "Век"}, {"id": "S01-VEK-015", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Ты не лжец, Томас. Только поэтому я всё ещё стою здесь. Так скажи мне, что вода вынесла наверх.", "dir": "пауза", "star": false, "cue": "Эта пришла снизу.", "cueChar": "Томас"}, {"id": "S01-TOMAS-016", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Пахло... старым металлом. И холодом. Как из подвала, который никогда—", "dir": "долгая пауза; почти решается", "star": false, "cue": "Ты не лжец, Томас. Только поэтому я всё ещё стою здесь. Так скажи мне, что вода вынесла наверх.", "cueChar": "Век"}, {"id": "S01-VEK-017", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Как что?", "dir": "", "star": false, "cue": "Пахло... старым металлом. И холодом. Как из подвала, который никогда—", "cueChar": "Томас"}, {"id": "S01-TOMAS-018", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Как ничего. Забудь. Руда плохая. Вот и всё.", "dir": "", "star": false, "cue": "Как что?", "cueChar": "Век"}, {"id": "S01-VEK-019", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Самый честный человек, которого я знаю. И теперь он не может закончить фразу под моей крышей.", "dir": "медленно", "star": true, "cue": "Как ничего. Забудь. Руда плохая. Вот и всё.", "cueChar": "Томас"}, {"id": "S01-TOMAS-020", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Не надо.", "dir": "раненно", "star": false, "cue": "Самый честный человек, которого я знаю. И теперь он не может закончить фразу под моей крышей.", "cueChar": "Век"}, {"id": "S01-VEK-021", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Век", "charKey": "vek", "line": "Тогда не заставляй меня смотреть, как ты врёшь. Что бы это ни было — если оно под старой леди, это и моё ремесло тоже. Принеси мне правду, Томас. Я найду, что с ней делать.", "dir": "пауза; мягче", "star": false, "cue": "Не надо.", "cueChar": "Томас"}, {"id": "S01-TOMAS-022", "scene": "S01", "sceneTitle": "Холод старой леди", "char": "Томас", "charKey": "tomas", "line": "Вот этого я и боюсь.", "dir": "тихо", "star": true, "cue": "Тогда не заставляй меня смотреть, как ты врёшь. Что бы это ни было — если оно под старой леди, это и моё ремесло тоже. Принеси мне правду, Томас. Я найду, что с ней делать.", "cueChar": "Век"}, {"id": "S02-TOMAS-001", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Мне нужно, чтобы вы прочли кое-что. И чтобы вы не говорили кузнецу.", "dir": "", "star": false, "cue": "", "cueChar": ""}, {"id": "S02-MIRA-002", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Это две просьбы, и вторая — из них главная. *(пауза)* Показывайте.", "dir": "", "star": false, "cue": "Мне нужно, чтобы вы прочли кое-что. И чтобы вы не говорили кузнецу.", "cueChar": "Томас"}, {"id": "S02-MIRA-003", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Откуда это?", "dir": "", "star": false, "cue": "Это две просьбы, и вторая — из них главная. *(пауза)* Показывайте.", "cueChar": "Мира"}, {"id": "S02-TOMAS-004", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Старая леди. Глубокий ствол. Это было в стене. В ней — в стене. Будто стена наросла вокруг.", "dir": "", "star": false, "cue": "Откуда это?", "cueChar": "Мира"}, {"id": "S02-MIRA-005", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Староимперское письмо. Его использовали для двух вещей, мастер Томас: для закона... и для войны. *(пауза)* Это не закон.", "dir": "тихо", "star": false, "cue": "Старая леди. Глубокий ствол. Это было в стене. В ней — в стене. Будто стена наросла вокруг.", "cueChar": "Томас"}, {"id": "S02-TOMAS-006", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "А что это?", "dir": "", "star": false, "cue": "Староимперское письмо. Его использовали для двух вещей, мастер Томас: для закона... и для войны. *(пауза)* Это не закон.", "cueChar": "Мира"}, {"id": "S02-MIRA-007", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Имя вверху. Я его знаю. Каждый кузнец на Пограничье его знает. *(пауза)* Первый Кузнец.", "dir": "обводя буквы", "star": false, "cue": "А что это?", "cueChar": "Томас"}, {"id": "S02-TOMAS-008", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Значит, клятва. Как у гильдии. Как клянутся кузнецы.", "dir": "с облегчением", "star": false, "cue": "Имя вверху. Я его знаю. Каждый кузнец на Пограничье его знает. *(пауза)* Первый Кузнец.", "cueChar": "Мира"}, {"id": "S02-MIRA-009", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Нет. *(долгая пауза)* Слова вокруг имени — не клятва. Это меры.", "dir": "", "star": false, "cue": "Значит, клятва. Как у гильдии. Как клянутся кузнецы.", "cueChar": "Томас"}, {"id": "S02-TOMAS-010", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Меры?", "dir": "", "star": false, "cue": "Нет. *(долгая пауза)* Слова вокруг имени — не клятва. Это меры.", "cueChar": "Мира"}, {"id": "S02-MIRA-011", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Жар. Пропорции. Время. Мастер Томас, это формула плавки.", "dir": "", "star": false, "cue": "Меры?", "cueChar": "Томас"}, {"id": "S02-TOMAS-012", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Для изготовления стали.", "dir": "не понимая", "star": false, "cue": "Жар. Пропорции. Время. Мастер Томас, это формула плавки.", "cueChar": "Мира"}, {"id": "S02-MIRA-013", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Для изготовления кое-чего. Империя не ковала свои клинки. Она их выращивала. Из того, что погребено глубоко.", "dir": "", "star": false, "cue": "Для изготовления стали.", "cueChar": "Томас"}, {"id": "S02-TOMAS-014", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Выращивать клинок. Клинки не выращивают. Руду копают, породу дробят, потом— потом его делают.", "dir": "", "star": false, "cue": "Для изготовления кое-чего. Империя не ковала свои клинки. Она их выращивала. Из того, что погребено глубоко.", "cueChar": "Мира"}, {"id": "S02-MIRA-015", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Его делают из руды, которая не должна гнуться от удара. Из руды, которая остыла в затопленном стволе. Из руды, которая— *(касается плиты)* —хм.", "dir": "мягко, точно", "star": false, "cue": "Выращивать клинок. Клинки не выращивают. Руду копают, породу дробят, потом— потом его делают.", "cueChar": "Томас"}, {"id": "S02-TOMAS-016", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Что?", "dir": "", "star": false, "cue": "Его делают из руды, которая не должна гнуться от удара. Из руды, которая остыла в затопленном стволе. Из руды, которая— *(касается плиты)* —хм.", "cueChar": "Мира"}, {"id": "S02-MIRA-017", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Она тёплая.", "dir": "", "star": false, "cue": "Что?", "cueChar": "Томас"}, {"id": "S02-TOMAS-018", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Она всегда тёплая. Я всё время говорю— *(обрывается)*", "dir": "", "star": false, "cue": "Она тёплая.", "cueChar": "Мира"}, {"id": "S02-MIRA-019", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Имперский камень держит тепло сутки. Одни сутки, мастер Томас. А эта плита тёплая. *(пауза)* Значит, под старой шахтой что-то до сих пор работает.", "dir": "", "star": false, "cue": "Она всегда тёплая. Я всё время говорю— *(обрывается)*", "cueChar": "Томас"}, {"id": "S02-TOMAS-020", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "До сих... работает.", "dir": "тихий ужас", "star": true, "cue": "Имперский камень держит тепло сутки. Одни сутки, мастер Томас. А эта плита тёплая. *(пауза)* Значит, под старой шахтой что-то до сих пор работает.", "cueChar": "Мира"}, {"id": "S02-MIRA-021", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "До сих пор работает. Простите. Это было— Мне придётся попросить вас о трудной вещи.", "dir": "почти с восторгом, затем спохватывается", "star": true, "cue": "До сих... работает.", "cueChar": "Томас"}, {"id": "S02-TOMAS-022", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Вы хотите показать это кузнецу.", "dir": "", "star": false, "cue": "До сих пор работает. Простите. Это было— Мне придётся попросить вас о трудной вещи.", "cueChar": "Мира"}, {"id": "S02-MIRA-023", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Я хочу показать это кузнецу.", "dir": "", "star": false, "cue": "Вы хотите показать это кузнецу.", "cueChar": "Томас"}, {"id": "S02-TOMAS-024", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", "line": "Он перекуёт её на гвозди.", "dir": "тихо", "star": false, "cue": "Я хочу показать это кузнецу.", "cueChar": "Мира"}, {"id": "S02-MIRA-025", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Мира", "charKey": "mira", "line": "Перекуёт.", "dir": "", "star": false, "cue": "Он перекуёт её на гвозди.", "cueChar": "Томас"}, {"id": "S02-TOMAS-026", "scene": "S02", "sceneTitle": "Гладкий, как стекло", "char": "Томас", "charKey": "tomas", const COLORS = {vek:'#e6a85c', tomas:'#9cc3e6', mira:'#a9cf9a'};
const LABELS = {all:'Все', vek:'Век', tomas:'Томас', mira:'Мира'};
let filter = 'all';
let showCue = true;
let size = 4.6;
let idx = 0;
const $ = id => document.getElementById(id);
const visLines = () => filter === 'all' ? LINES : LINES.filter(l => l.charKey === filter);
const strip = s => s.replace(/\*\((.*?)\)\*/g, '($1)').replace(/\*/g, '').replace(/★/g, '').trim();
function render(){
  const v = visLines();
  if (!v.length) return;
  if (idx < 0) idx = 0;
  if (idx > v.length - 1) idx = v.length - 1;
  const l = v[idx];
  const color = COLORS[l.charKey] || '#efeae0';
  $('scene').textContent = l.scene + ' · ' + l.sceneTitle;
  $('progress').textContent = (idx + 1) + ' / ' + v.length + (filter === 'all' ? '' : ' · ' + LABELS[filter]);
  $('char').textContent = l.char;
  $('char').style.color = color;
  $('line').textContent = strip(l.line);
  $('line').style.color = color;
  $('star').textContent = l.star ? '★ ключевая реплика' : '';
  $('cue').textContent = (showCue && l.cue) ? ('подсказка · ' + l.cueChar + ': «' + strip(l.cue) + '»') : '';
  $('dir').textContent = l.dir ? ('(' + truncate(l.dir, 160) + ')') : '';
  document.title = l.id + ' — ' + l.char + ' — телепромптер';
}
function truncate(s, n){ return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function step(d){ idx += d; render(); }
function setFilter(f){
  filter = f; idx = 0;
  document.querySelectorAll('button.filter').forEach(b => b.classList.toggle('active', b.dataset.key === f));
  render();
}
function setSize(d){
  size = Math.min(9, Math.max(2.6, size + d));
  document.documentElement.style.setProperty('--line-size', size + 'vw');
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { e.preventDefault(); setSize(0.3); }
  else if (e.key === 'ArrowDown' || e.key === '-' || e.key === '_') { e.preventDefault(); setSize(-0.3); }
  else if (e.key === '1') setFilter('vek');
  else if (e.key === '2') setFilter('tomas');
  else if (e.key === '3') setFilter('mira');
  else if (e.key === '0') setFilter('all');
  else if (e.key === 'c' || e.key === 'C') { showCue = !showCue; $('cueToggle').textContent = 'Подсказка: ' + (showCue ? 'вкл' : 'выкл'); render(); }
  else if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
});
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
document.querySelectorAll('button.filter').forEach(b => b.onclick = () => setFilter(b.dataset.key));
$('cueToggle').onclick = () => { showCue = !showCue; $('cueToggle').textContent = 'Подсказка: ' + (showCue ? 'вкл' : 'выкл'); render(); };
$('sizeDown').onclick = () => setSize(-0.3);
$('sizeUp').onclick = () => setSize(0.3);
render();
</script>
