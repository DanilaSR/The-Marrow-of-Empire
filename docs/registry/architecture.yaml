# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: cgo_large_model_inference
    status: active
    description: "Never use in-process CGo for LLM models exceeding 500M parameters. A 3B+ model crash must never take down the game. Use separate-process IPC instead. Tiny models (<500M, <400MB disk) may use CGo with recover() guard as a latency-critical fast-path."
    why: "Process isolation prevents a model crash from killing the game. The IPC overhead (~1-5ms) is negligible compared to ~2s inference latency for large models."
    adr: docs/architecture/adr-0008-llm-inference-integration.md
    added: 2026-08-12

