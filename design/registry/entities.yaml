formulas:

  # ── Camera System ─────────────────────────────────────────────────────────
  - name: camera_ground_footprint
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
      - design/gdd/asset-scene-pipeline.md
      - design/gdd/living-environment.md
    expression: "ground_depth = 2*O / sin(theta); ground_width = 2*O*AR"
    variables:
      - O (ortho half-height, 2.5-20u)
      - theta (pitch, fixed 30 deg)
      - AR (aspect ratio, 1.6-2.333)
    output_range: ["depth 10-80u", "width 8.9-93.3u"]
    added: 2026-08-09
    revised: ""

  - name: camera_follow_move_toward
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    expression: "step = min(follow_speed * dt, |offset|); position += normalize(offset) * step"
    variables:
      - follow_speed (5 u/s default, 2-15 range)
      - dt (clamped to 100ms max)
      - offset (target_position - camera_position)
    output_range: ["step in [0, |offset|] per frame"]
    added: 2026-08-09
    revised: ""

  # ── Living Environment ────────────────────────────────────────────────────
  - name: game_time_formula
    status: active
    source: design/gdd/living-environment.md
    referenced_by:
      - design/gdd/living-environment.md
    expression: "game_minutes = real_seconds * time_ratio / 60"
    variables:
      - real_seconds (float, any)
      - time_ratio (int, 5-30)
    output_range: [any]
    added: 2026-08-09
    revised: ""

