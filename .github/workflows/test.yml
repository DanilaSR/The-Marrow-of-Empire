name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Unit Tests
        working-directory: src
        run: go test ./tests/unit/... -v -count=1
        env:
          CGO_ENABLED: 1

  integration-tests:
    name: Kaiju Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Vulkan SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build Kaiju Engine
        working-directory: src
        run: CGO_ENABLED=1 go build -tags="debug,editor,filedrop,rawsrc" -o ../bin/ ./
        env:
          CGO_ENABLED: 1

      - name: Run Integration Tests
        working-directory: src
        run: go test ./tests/integration/... -v -count=1 -tags="debug,editor,filedrop,rawsrc"
        env:
          CGO_ENABLED: 1
