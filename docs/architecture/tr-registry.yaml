  # ─── Main Menu & Settings ───
  - id: TR-menu-001
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "7-state screen-flow state machine (TitleScreen/LoadGame/InGame/PauseMenu/SaveGame/Settings/Loading); Settings remembers entry point for back-destination; InGame→TitleScreen requires confirmation"
    domain: UI
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-002
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "settings.cfg JSON persistence: per-user, not per-save; json.Decode on boot; missing/corrupt→defaults+first-launch prompt; instant apply on change; each system declares its settings schema"
    domain: State
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-003
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Debounced settings write: dirty-flag + flush within 500ms or clean shutdown; never synchronous disk I/O in render loop; write failure keeps in-memory, retries next change"
    domain: Threading
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-004
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Display-mode preview: 3-second preview with Keep/Revert, auto-revert after 15s; game never permanently locks into unusable display mode"
    domain: Platform
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-005
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Keybinding model: per-action primary+secondary bindings as [modifier]+[key]; atomic one-hop conflict resolution; reserved keys rebindable with warning; gamepad preset profiles at MVP; Input Binding System owns runtime registry"
    domain: UI
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-006
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Save slot data contract: 22 slots (20+auto+quick), metadata (slot ID, name, character, playtime, region, thumbnail 320×180, timestamp), sorted last-modified descending, overwrite confirmation, corrupted-save dialog"
    domain: UI
    adr: ADR-0012, ADR-0002
    added: 2026-08-12
  - id: TR-menu-007
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Save thumbnail capture: 320×180 PNG from game viewport (engine screenshot/framebuffer capability)"
    domain: Engine
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-008
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Steam Cloud: sync on launch, conflict modal (Keep Local/Cloud/Decide Later), unresolved→persistent banner+auto-saves blocked, backup 30 days, offline→local-only; Steam RemoteStorage wrapper deferred engine work"
    domain: Platform
    adr: ADR-0012, ADR-0002
    added: 2026-08-12
  - id: TR-menu-009
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Pause freeze: Escape suspends engine update loop for ALL simulation systems; zero game logic advances; 300ms toggle cooldown; blocked during cutscenes/transitions/save; input locked during Loading"
    domain: Threading
    adr: ADR-0012, ADR-0007
    added: 2026-08-12
  - id: TR-menu-010
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Pause dim layering: world dims to 30% over 200ms; combat HUD above dim layer; HUD not re-rendered while paused (draw-call delta=0)"
    domain: Rendering
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-011
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Screen transitions: 250ms crossfade for screen-to-screen; Loading uses hard cut to black; input not processed during crossfades; frame-rate independent timing"
    domain: Threading
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-012
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "First-launch accessibility prompt: one-time modal over title screen (Reduce Camera Motion: Reduced; Subtitles: On; Remember my choice); keyboard+gamepad navigable; no timer; persisted to settings.cfg; re-runnable from Settings→Accessibility"
    domain: UI
    adr: ADR-0012, ADR-0003
    added: 2026-08-12
  - id: TR-menu-013
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Graphics settings: resolution, display mode, FPS cap, VSync via engine config; deferred engine caps greyed with Coming Soon at MVP (VSync reconfig, texture quality, AA, audio device, Steam Cloud, pause low-pass)"
    domain: Platform
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-014
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Performance: Settings screen (6 categories) UI update ≤2ms p95; pause over combat (10 combatants, full HUD) frame time ≤16.6ms p95"
    domain: Performance
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-015
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Testability seams: injectable game-time clock; fixed-step 60Hz simulation harness with frame-stepping; per-system TicksAdvanced() freeze assertions; fade assertions via clamp(t/duration,0,1)"
    domain: Threading
    adr: ADR-0012
    added: 2026-08-12
  - id: TR-menu-016
    status: active
    source: design/gdd/main-menu-and-settings.md
    requirement: "Screen-space rendering: menu UI unaffected by camera shake/zoom/transitions; edge-scroll suppressed when cursor over any UI panel"
    domain: UI
    adr: ADR-0012, ADR-0003
    added: 2026-08-12

  # ─── Loot & Economy ───
  - id: TR-loot-001
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Item data schema: item_id, name, type, subtype, rarity (5 tiers with stat budgets+value multipliers), stats map, weight, value, stack_size, description, icon_ref, equipment_slot (shared registry), required_attrs, identified, region_tier"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-002
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Loot tables: keyed by source category (enemy tiers, container types, merchant) × region tier; weighted rolls; conditional gates (thread, trust, faction, discovery); deterministic/seeded RNG for statistical ACs"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-003
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Merchant/shop model: tiered inventory+rarity ceiling per shop tier; restock 72-240 game hours; pricing base×faction×CHA barter (floor 0.25×, sell 0.25×); trust-gated stock; buyback pool 72h; shop state machine; hostile-faction refusal"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-004
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Identification state machine: Common/Uncommon auto-identify on pickup; Rare+ unidentified (stats hidden, equippable without bonuses); cost formula with INT discount (min 5g); camp self-identify once per rest (INT≥14 Rare, ≥16 Epic); Legendary always merchant/thread; re-identifying equipped snaps stats"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-005
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Container contract: EF Container component (contents, capacity, is_locked, indestructible) + InteractionType.loot; loot UI; partial-loot tracking; body looting (persist 72h, thread-critical auto-loot); locked: key/lockpick(DEX)/forced(STR,50% destroy)"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-006
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Action API: L&E owns Inventory component write path; equip/unequip/sell/drop/identify as actions; TCE triggers request_loot_drop; gold auto-looted on interaction; quest items non-sellable/non-droppable"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-007
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Persistence: looted-container state, restock timers, merchant buyback, shop stock, body despawn serialized (EF components + loot-table state); must survive sessions"
    domain: State
    adr: ADR-0015
    added: 2026-08-12
  - id: TR-loot-008
    status: active
    source: design/gdd/loot-economy.md
    requirement: "Cross-system data reads: faction.standing (price, refusal), trust_level (gated stock, buyback), STR (carry, equip, forced-open), INT (identify discount, self-identify), CHA (barter modifier)"
    domain: Economy
    adr: ADR-0015
    added: 2026-08-12
